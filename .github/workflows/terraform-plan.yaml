name: Terraform Plan

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_my_ip: ${{ secrets.SSH_CIDR }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_ecr_repository_uri: ${{ vars.ECR_REPOSITORY_URI }}
      TF_VAR_webui_db_username: ${{ secrets.WEBUI_DB_USERNAME }}
      TF_VAR_webui_db_password: ${{ secrets.WEBUI_DB_PASSWORD }}
      TF_VAR_webui_secret_key: ${{ secrets.WEBUI_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"

      - name: AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.ALLOWED_ACCOUNT_IDS }}

      - name: Terraform Plan
        run: |
          terraform init
          terraform validate
          terraform plan
